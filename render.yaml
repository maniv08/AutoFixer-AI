services:
  - type: web
    name: autofixer-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
